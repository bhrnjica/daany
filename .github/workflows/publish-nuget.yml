name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      daany_version:
        description: "Daany NuGet package Version"
        required: true
        default: "2.2.6"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Build Rust library (Linux)
      run: cargo build --release --manifest-path src/daany_rust/Cargo.toml

    - name: Copy Rust library to target path
      run: |
        mkdir -p src/daany_rust/rust_lib/linux32-x64
        cp src/daany_rust/target/release/libdaany_rust_lib.so src/daany_rust/rust_lib/linux32-x64/libdaany_rust_lib.so

    - name: Upload Linux Rust binary
      uses: actions/upload-artifact@v4
      with:
        name: rust-linux
        path: src/daany_rust/rust_lib/linux32-x64/libdaany_rust_lib.so

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Build Rust library (Windows)
      run: cargo build --release --manifest-path src/daany_rust/Cargo.toml

    - name: Copy Rust library to target path
      shell: pwsh
      run: |
        $dir = "src/daany_rust/rust_lib/win32-x64"
        if (!(Test-Path $dir)) {
          New-Item -ItemType Directory -Path $dir | Out-Null
        }
        Copy-Item -Path "src/daany_rust/target/release/daany_rust_lib.dll" -Destination "$dir/daany_rust_lib.dll"

    - name: Upload Windows Rust binary
      uses: actions/upload-artifact@v4
      with:
        name: rust-windows
        path: src/daany_rust/rust_lib/win32-x64/daany_rust_lib.dll

  publish-nuget:
    runs-on: windows-latest
    needs: [build-linux, build-windows]
    env:
      DAANY_VERSION: ${{ github.event.inputs.daany_version }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Download Rust binaries
      uses: actions/download-artifact@v4
      with:
        name: rust-linux
        path: src/daany_rust/rust_lib/linux32-x64/

    - name: Download Rust binaries
      uses: actions/download-artifact@v4
      with:
        name: rust-windows
        path: src/daany_rust/rust_lib/win32-x64/

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Projects for net7, net8, net9
      run: |
        dotnet build src/daany.df/Daany.DataFrame.csproj -c Release -f net7.0
        dotnet build src/daany.df/Daany.DataFrame.csproj -c Release -f net8.0
        dotnet build src/daany.df/Daany.DataFrame.csproj -c Release -f net9.0

        dotnet build src/daany.ext/Daany.DataFrame.Ext.csproj -c Release -f net7.0
        dotnet build src/daany.ext/Daany.DataFrame.Ext.csproj -c Release -f net8.0
        dotnet build src/daany.ext/Daany.DataFrame.Ext.csproj -c Release -f net9.0

        dotnet build src/daany.stat/Daany.Stat.csproj -c Release -f net7.0
        dotnet build src/daany.stat/Daany.Stat.csproj -c Release -f net8.0
        dotnet build src/daany.stat/Daany.Stat.csproj -c Release -f net9.0

        dotnet build src/daany.lina/Daany.LinA.csproj -c Release -f net7.0
        dotnet build src/daany.lina/Daany.LinA.csproj -c Release -f net8.0
        dotnet build src/daany.lina/Daany.LinA.csproj -c Release -f net9.0

    - name: Download nuget.exe
      run: curl -L -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

    - name: Pack NuGet Packages
      shell: pwsh
      run: |
        ./nuget.exe pack nuget_specs/Daany.DataFrame_v2.nuspec -Properties "Configuration=Release;Version=$env:DAANY_VERSION" -OutputDirectory nuget/
        ./nuget.exe pack nuget_specs/Daany.DataFrame.Ext_v2.nuspec -Properties "Configuration=Release;Version=$env:DAANY_VERSION" -OutputDirectory nuget/
        ./nuget.exe pack nuget_specs/Daany.Stat_v2.nuspec -Properties "Configuration=Release;Version=$env:DAANY_VERSION" -OutputDirectory nuget/
        ./nuget.exe pack nuget_specs/Daany.LinA_v2.nuspec -Properties "Configuration=Release;Version=$env:DAANY_VERSION" -OutputDirectory nuget/

    - name: Publish NuGet Packages
      run: |
        $version = "${{ env.DAANY_VERSION }}"
        ./nuget.exe push nuget/Daany.DataFrame.$version.nupkg -ApiKey ${{ secrets.NUGET_API_KEY }} -Source https://api.nuget.org/v3/index.json
        ./nuget.exe push nuget/Daany.DataFrame.Ext.$version.nupkg -ApiKey ${{ secrets.NUGET_API_KEY }} -Source https://api.nuget.org/v3/index.json
        ./nuget.exe push nuget/Daany.Stat.$version.nupkg -ApiKey ${{ secrets.NUGET_API_KEY }} -Source https://api.nuget.org/v3/index.json
        ./nuget.exe push nuget/Daany.LinA.$version.nupkg -ApiKey ${{ secrets.NUGET_API_KEY }} -Source https://api.nuget.org/v3/index.json
