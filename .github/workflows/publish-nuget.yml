name: Publish NuGet Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      daany_version:
        description: "Daany NuGet package Version"
        required: true
        default: "2.2.6"

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Rust library (Linux)
      run: cargo build --release --manifest-path src/daany_rust/Cargo.toml

    - name: Copy Rust library to lib (Linux)
      run: |
        mkdir -p src/daany_rust/rust_lib/linux32-x64
        cp src/daany_rust/target/release/libdaany_rust_lib.so src/daany_rust/rust_lib/linux32-x64/daany_rust_lib.so

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build -c Release

    - name: Publish Daany.LinA for net8.0
      run: dotnet publish src/daany.lina/Daany.LinA.csproj -c Release -f net8.0 -o src/daany.lina/bin/Release/net8.0

    - name: Publish Daany.LinA for net9.0
      run: dotnet publish src/daany.lina/Daany.LinA.csproj -c Release -f net9.0 -o src/daany.lina/bin/Release/net9.0

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-artifacts
        path: |
          src/daany_rust/rust_lib/linux32-x64/
          src/daany.lina/bin/Release/net8.0/
          src/daany.lina/bin/Release/net9.0/

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Build Rust library (Windows)
      run: cargo build --release --manifest-path src/daany_rust/Cargo.toml

    - name: Copy Rust library to lib (Windows)
      shell: pwsh
      run: |
        $dir = "src/daany_rust/rust_lib/win32-x64"
        if (!(Test-Path $dir)) {
          New-Item -ItemType Directory -Path $dir | Out-Null
        }
        Copy-Item -Path "src/daany_rust/target/release/daany_rust_lib.dll" -Destination "$dir/daany_rust_lib.dll"

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build -c Release

    - name: Publish Daany.LinA for net8.0
      run: dotnet publish src/daany.lina/Daany.LinA.csproj -c Release -f net8.0 -o src/daany.lina/bin/Release/net8.0

    - name: Publish Daany.LinA for net9.0
      run: dotnet publish src/daany.lina/Daany.LinA.csproj -c Release -f net9.0 -o src/daany.lina/bin/Release/net9.0

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-artifacts
        path: |
          src/daany_rust/rust_lib/win32-x64/
          src/daany.lina/bin/Release/net8.0/
          src/daany.lina/bin/Release/net9.0/

  publish-nuget:
    runs-on: windows-latest
    needs: [build-linux, build-windows]
    env:
      DAANY_VERSION: ${{ github.event.inputs.daany_version }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Download Linux Artifacts
      uses: actions/download-artifact@v4
      with:
        name: linux-artifacts
        path: src/

    - name: Download Windows Artifacts
      uses: actions/download-artifact@v4
      with:
        name: windows-artifacts
        path: src/

    - name: Rename Linux Rust Library for NuGet
      shell: pwsh
      run: |
        $src = "src/daany_rust/rust_lib/linux32-x64/daany_rust_lib.so"
        $dest = "src/daany_rust/rust_lib/linux32-x64/libdaany_rust_lib.so"
        if (Test-Path $src) {
          Copy-Item -Path $src -Destination $dest -Force
        }

    - name: Download nuget.exe
      run: |
        curl -L -o nuget.exe https://dist.nuget.org/win-x86-commandline/latest/nuget.exe

    - name: Pack NuGet Packages
      shell: pwsh
      run: |
        ./nuget.exe pack nuget_specs/Daany.DataFrame_v2.nuspec -Properties "Configuration=Release;Version=$env:DAANY_VERSION" -IncludeReferencedProjects -OutputDirectory nuget/
        ./nuget.exe pack nuget_specs/Daany.DataFrame.Ext_v2.nuspec -Properties "Configuration=Release;Version=$env:DAANY_VERSION" -IncludeReferencedProjects -OutputDirectory nuget/
        ./nuget.exe pack nuget_specs/Daany.Stat_v2.nuspec -Properties "Configuration=Release;Version=$env:DAANY_VERSION" -IncludeReferencedProjects -OutputDirectory nuget/
        ./nuget.exe pack nuget_specs/Daany.LinA_v2.nuspec -Properties "Configuration=Release;Version=$env:DAANY_VERSION" -IncludeReferencedProjects -OutputDirectory nuget/

    - name: Publish NuGet Packages
      run: ./nuget.exe push nuget/*.nupkg -ApiKey ${{ secrets.NUGET_API_KEY }} -Source https://api.nuget.org/v3/index.json
